services:
  - type: web
    name: campusfind
    runtime: python
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 wsgi:app"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
