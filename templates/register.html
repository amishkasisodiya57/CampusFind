{% extends "base.html" %}

{% block title %}Register - CampusFind{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
        <div class="p-4 text-center" style="background: linear-gradient(135deg, var(--dark-navy) 0%, var(--primary-navy) 100%); color: #ffffff;">
          <i class="fa-solid fa-compass fs-1 text-info mb-2"></i>
          <h3 class="fw-bold mb-1">Create Account</h3>
          <p class="text-secondary small mb-0">Join your campus lost &amp; found network</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form method="POST" action="{{ url_for('register') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-user text-muted"></i></span>
                <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Amishka Sisodiya" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">College / University Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="student@college.edu" required>
              </div>
              <div class="form-text">We'll use this to safely notify you when items match.</div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <button type="submit" class="btn btn-teal w-100 py-2 fs-6 fw-bold shadow-sm">
              <i class="fa-solid fa-user-plus me-2"></i> Register Account
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="text-muted small mb-0">
              Already have an account? 
              <a href="{{ url_for('login') }}" class="text-teal fw-semibold text-decoration-none">Log in here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
